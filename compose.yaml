services:
  mongodb:
    image: mongo:8.0
    # Use per-thread allocator caches for local compatibility with Linux 6.19+.
    # See MongoDB SERVER-121912 and docs/ADMIN_SETUP.md.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - rug-mongodb:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  rug-mongodb:
